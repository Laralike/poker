<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="Poker">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<meta name="theme-color" content="#ccc" />

		<title>Hole Cards</title>

		<link rel="apple-touch-icon" href="icons/180x180.png" />
		<link rel="shortcut icon" href="icons/favicon.png">
		<link rel="manifest" href="manifest.json">
		<link rel="stylesheet" href="css/style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<!-- Loaded without blocking the page. The game must appear immediately even when this
			cannot be reached at all: on a network that blocks Google, waiting for it held every page
			back by about thirteen seconds before anything was drawn. The fallback stack below it
			carries the layout until the font arrives, if it ever does. -->
		<link href="https://fonts.googleapis.com/css2?family=Secular+One&display=swap" rel="stylesheet"
			media="print" onload="this.media='all'; this.onload=null;">
		<noscript>
			<link href="https://fonts.googleapis.com/css2?family=Secular+One&display=swap" rel="stylesheet">
		</noscript>
	</head>

	<body id="hole-cards">
		<div id="single">
			<div class="hole-cards ">
				<img class="big" src="cards/1B.svg">
				<img class="big" src="cards/1B.svg">
				<div class="pill win-probability hidden"></div>
				<div class="pill hand-strength hidden"></div>
			</div>
			<h3>Player Name</h3>
			<div class="chips"><span class="total">2000</span><span class="bet hidden">0</span><span id="pot"
				class="hidden">0</span>
		</div>
			<div id="single-action-panel" class="hidden">
				<section class="actions">
					<button type="button" id="single-fold-button" class="hidden" name="button">Fold</button>
					<button type="button" id="single-action-button" class="hidden" name="button">Check</button>
					<div id="single-amount-controls" class="amount-controls hidden">
						<button type="button" id="single-amount-decrement-button" class="amount-step-button"
							name="button">-</button>
						<input type="range" id="single-amount-slider" name="amount" value="0" min="0" max="2000"
							step="10">
						<div class="amount-value-field">
							<span class="amount-prefix" aria-hidden="true">£</span>
							<input type="number" id="single-amount-input" class="amount-value" name="amount-value"
								inputmode="numeric" value="0" min="0" step="10" aria-label="Amount to raise to">
						</div>
						<button type="button" id="single-amount-increment-button" class="amount-step-button"
							name="button">+</button>
					</div>
					<div id="single-table-controls" class="table-controls hidden">
						<button type="button" id="single-fast-forward-button" class="hidden"
							name="button">Fast Forward</button>
						<button type="button" id="single-next-round-button" class="hidden" name="button">Deal
						Next Round</button>
					</div>
					<a id="single-switch-link" class="action-link hidden" href="remoteTable.html">switch to full table
					view</a>
					<button type="button" id="sound-button" class="sound-toggle">Sound on</button>
				</section>
			</div>
			<div id="singleview-notifications" class="hidden"></div>
			<footer>
				<div id="credit">
					<a href="https://github.com/Tehes/poker" class="attribution">Based on Poker by Tehes</a>
					<span class="attribution-note">Modified, unofficial version</span>
				</div>
			</footer>
		</div>
		<script type="module" src="./js/singleView.js"></script>
	</body>
</html>
